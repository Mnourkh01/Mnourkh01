name: GitHub Stats

# Renders assets/stats.svg, assets/contributions.svg and
# assets/contribution-city.svg from live GitHub data and commits them, so the
# README shows fresh stats without a rate-limited third-party image service.
# Needs a classic PAT (scopes: repo, read:user) as the STATS_TOKEN repo secret:
# the numbers include private-repo work, which the built-in token cannot see.

on:
  schedule:
    - cron: "0 4 * * *"      # daily refresh
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches: [main]
    paths:                    # only re-render when the generator itself changes
      - "scripts/github-stats.mjs"
      - "scripts/city-svg.mjs"
      - "scripts/private-calendar.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The SVGs count private-repo work, which only a token that can read those
      # repos sees. Without it, keep the committed SVGs rather than overwrite
      # them with public-only numbers.
      HAS_STATS_TOKEN: ${{ secrets.STATS_TOKEN != '' }}
      PRIVATE_AWARE: "1"
    steps:
      - name: Skip refresh without STATS_TOKEN
        if: env.HAS_STATS_TOKEN != 'true'
        run: echo "::warning::STATS_TOKEN is not set, the stats SVGs are not refreshed."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats SVGs
        if: env.HAS_STATS_TOKEN == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/github-stats.mjs

      - name: Generate contribution city
        id: city
        if: env.HAS_STATS_TOKEN == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/city-svg.mjs

      - name: Flag a failed city render
        if: steps.city.outcome == 'failure'
        run: echo "::warning::contribution city failed to render, the committed one is kept."

      - name: Commit refreshed SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/contributions.svg assets/contribution-city.svg
          if git diff --cached --quiet; then
            echo "No stat changes to commit."
          else
            git commit -m "chore(stats): refresh GitHub stats SVGs [skip ci]"
            git push
          fi
